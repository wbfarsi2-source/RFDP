workflows:
  android-build:
    name: Kintara APK Build

    max_build_duration: 60

    environment:
      vars:
        ANDROID_HOME: /opt/android-sdk

    scripts:
      - name: Build Kintara APK
        script: |
          cd "KintaraMarket-v2.2.0-kintara-play-source-modified/kintara_src"
          chmod +x build.sh
          ./build.sh

    artifacts:
      - "**/*.apk"
