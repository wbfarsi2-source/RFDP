workflows:
  android-build:
    name: Kintara APK Build

    max_build_duration: 60

    scripts:
      - name: Locate project and Build APK
        script: |
          set -e
          pwd
          ls -la
          cd "KintaraMarket-v2.2.0-kintara-play-source-modified/kintara_src"
          ls -la
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - "**/app/build/outputs/**/*.apk"
