workflows:
  android-build:
    name: Kintara APK Build

    max_build_duration: 60

    scripts:
      - name: Install Android SDK 35
        script: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager "platforms;android-35"
          yes | sdkmanager "build-tools;35.0.0"

      - name: Build Kintara APK
        script: |
          cd "KintaraMarket-v2.2.0-kintara-play-source-modified/kintara_src"
          chmod +x build.sh
          ./build.sh

    artifacts:
      - "**/*.apk"
