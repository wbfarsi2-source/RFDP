name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Same settings as the original working workflow
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Remove old firewall rule if present
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP on port 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."


      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper |
              Get-Random -Count 4

          $rawPassword += $charSet.Lower |
              Get-Random -Count 4

          $rawPassword += $charSet.Number |
              Get-Random -Count 4

          $rawPassword += $charSet.Special |
              Get-Random -Count 4

          $password = -join (
              $rawPassword |
              Sort-Object { Get-Random }
          )

          $securePass = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -AccountNeverExpires

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP"

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"

          # Save password for later workflow steps
          "RDP_PASSWORD=$password" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          Write-Host "RDP user created successfully."


      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
              -Uri $tsUrl `
              -OutFile $installerPath

          Write-Host "Installing Tailscale..."

          Start-Process `
              msiexec.exe `
              -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
              -Wait

          Remove-Item `
              $installerPath `
              -Force

          $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscalePath)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."


      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Important:
          # Stop immediately if GitHub Secret is missing.
          # This prevents Tailscale from waiting for browser login.
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing or empty."
              exit 1
          }

          Write-Host "Connecting RFDP runner to Tailscale..."

          & $tailscale up `
              --auth-key="$env:TS_AUTH_KEY" `
              --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale authentication failed. Check the Auth Key."
              exit 1
          }

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $candidate = & $tailscale ip -4 2>$null

              if ($candidate) {
                  $tsIP = (
                      $candidate |
                      Select-Object -First 1
                  ).Trim()
              }

              if (-not $tsIP) {
                  Write-Host "Waiting for Tailscale IP... ($($retries + 1)/10)"
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"
          Write-Host ""


      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP..."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host ""
          Write-Host "TCP connectivity successful!"
          Write-Host ""


      - name: Maintain Connection
        shell: pwsh
        run: |
          # Do NOT use Clear-Host in GitHub Actions.

          Write-Host ""
          Write-Host "============================================"
          Write-Host "                RFDP READY"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Port    : 3389"
          Write-Host ""
          Write-Host "============================================"
          Write-Host " Keep this workflow running while connected "
          Write-Host "============================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP ACTIVE"
              Start-Sleep -Seconds 300
          }
