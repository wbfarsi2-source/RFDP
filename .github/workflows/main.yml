name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rfdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RFDP Remote Desktop
        shell: pwsh
        run: |
          Write-Host "Configuring RFDP Remote Desktop..."

          # Enable Windows Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # RDP-Tcp is the Windows system registry path - DO NOT rename
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Remote Desktop Windows service
          Set-Service -Name TermService -StartupType Automatic

          if ((Get-Service TermService).Status -eq 'Running') {
              Restart-Service -Name TermService -Force
          }
          else {
              Start-Service -Name TermService
          }

          Write-Host "RFDP Remote Desktop configured successfully."

      - name: Create RFDP User
        shell: pwsh
        run: |
          Write-Host "Creating RFDP user..."

          $upper   = [char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
          $lower   = [char[]]'abcdefghijklmnopqrstuvwxyz'
          $numbers = [char[]]'0123456789'
          $special = [char[]]'!@#$%*-_+='

          $rawPassword = @()
          $rawPassword += $upper   | Get-Random -Count 4
          $rawPassword += $lower   | Get-Random -Count 4
          $rawPassword += $numbers | Get-Random -Count 4
          $rawPassword += $special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove old RFDP account if it exists
          $existingUser = Get-LocalUser `
            -Name "RFDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name "RFDP"
          }

          # Create RFDP Windows user
          New-LocalUser `
            -Name "RFDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires

          # Give administrator privileges
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RFDP"

          # This is the official Windows group name - DO NOT rename
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RFDP"

          # Save password for later workflow steps
          "RFDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          if (-not (Get-LocalUser -Name "RFDP" -ErrorAction SilentlyContinue)) {
              Write-Error "RFDP user creation failed."
              exit 1
          }

          Write-Host "RFDP user created successfully."

      - name: Connect RFDP to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Configure RFDP Firewall
        shell: pwsh
        run: |
          Write-Host "Configuring RFDP firewall..."

          Remove-NetFirewallRule `
            -DisplayName "RFDP-Tailscale" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RFDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Write-Host "RFDP firewall rule created."

      - name: Get RFDP Tailscale IP
        shell: pwsh
        run: |
          $tailscale = (Get-Command tailscale.exe -ErrorAction Stop).Source

          $tsIP = $null

          for ($i = 1; $i -le 15; $i++) {
              try {
                  $candidate = (& $tailscale ip -4 2>$null |
                    Select-Object -First 1).Trim()

                  if ($candidate -match '^100\.') {
                      $tsIP = $candidate
                      break
                  }
              }
              catch {
                  # Wait and retry
              }

              Write-Host "Waiting for RFDP Tailscale IP... ($i/15)"
              Start-Sleep -Seconds 4
          }

          if (-not $tsIP) {
              Write-Error "RFDP Tailscale IPv4 address was not assigned."
              exit 1
          }

          "RFDP_TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RFDP Tailscale IP: $tsIP"

      - name: Verify RFDP Connection
        shell: pwsh
        run: |
          Write-Host "Testing RFDP on $env:RFDP_TAILSCALE_IP..."

          $result = Test-NetConnection `
            -ComputerName $env:RFDP_TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RFDP connection on port 3389 is not accessible."
              exit 1
          }

          Write-Host "RFDP connection is ready."

      - name: Show RFDP Connection Info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RFDP READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address : $env:RFDP_TAILSCALE_IP"
          Write-Host "Username: .\RFDP"
          Write-Host "Password: $env:RFDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Connect using Windows Remote Desktop."
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP is active."
              Start-Sleep -Seconds 300
          }
