name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURE REMOTE DESKTOP
      # ============================================================

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Same settings as original working configuration
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Remove old firewall rule if present
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP port
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 2

          Write-Host "Remote Desktop configured successfully."


      # ============================================================
      # 2. CREATE TMA WINDOWS USER
      # ============================================================

      - name: Create TMA User
        shell: pwsh
        run: |
          Write-Host "Creating TMA Windows user..."

          $username = "TMA"
          $password = "14789632Javad@"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove existing TMA user if present
          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Existing TMA account found. Removing it..."

              Remove-LocalUser `
                -Name $username
          }

          # Create TMA account
          New-LocalUser `
            -Name $username `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RFDP Remote Desktop User"

          # Add TMA to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          # Add TMA to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Verify account
          $verifyUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $verifyUser) {
              Write-Error "TMA user creation failed."
              exit 1
          }

          Write-Host "TMA user created successfully."


      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Downloading Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."


      # ============================================================
      # 4. CONNECT TO TAILSCALE
      # ============================================================

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Stop immediately if GitHub Secret is missing
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing or empty."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale authentication failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $candidate = & $tailscale ip -4 2>$null

              if ($candidate) {

                  $candidate = (
                    $candidate |
                    Select-Object -First 1
                  ).Trim()

                  if ($candidate -match '^100\.') {
                      $tsIP = $candidate
                  }
              }

              if (-not $tsIP) {

                  Write-Host "Waiting for Tailscale IP... ($($retries + 1)/10)"

                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          # Save IP for next steps
          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"
          Write-Host ""


      # ============================================================
      # 5. VERIFY RDP
      # ============================================================

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Testing Remote Desktop..."
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port   : 3389"
          Write-Host ""

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {

              Write-Host "First test failed."
              Write-Host "Restarting Remote Desktop service..."

              Restart-Service `
                -Name TermService `
                -Force

              Start-Sleep -Seconds 5

              $testResult = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue
          }

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host ""
          Write-Host "RDP connectivity successful!"
          Write-Host ""


      # ============================================================
      # 6. KEEP RFDP RUNNING
      # ============================================================

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                  RFDP READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: TMA"
          Write-Host "Password: 14789632Javad@"
          Write-Host "Port    : 3389"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RFDP CONNECTION IS ACTIVE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Keep this workflow running while connected."
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP ACTIVE"

              Start-Sleep -Seconds 300
          }
