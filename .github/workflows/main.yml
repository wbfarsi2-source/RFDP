name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. GET RFDP / GAMEBOT FILES
      # ============================================================

      - name: Download RFDP Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURE REMOTE DESKTOP
      # ============================================================

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 2

          Write-Host "Remote Desktop configured successfully."


      # ============================================================
      # 3. CREATE TMA USER
      # ============================================================

      - name: Create TMA User
        shell: pwsh
        run: |
          Write-Host "Creating TMA Windows user..."

          $username = "TMA"
          $password = "14789632Javad@"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RFDP Remote Desktop User"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              Write-Error "TMA user creation failed."
              exit 1
          }

          Write-Host "TMA user created successfully."


      # ============================================================
      # 4. PREPARE GAMEBOT
      # ============================================================

      - name: Prepare GameBot
        shell: pwsh
        run: |
          Write-Host "Preparing GameBot..."

          $source = "$env:GITHUB_WORKSPACE\GameBot"
          $destination = "C:\GameBot"

          if (-not (Test-Path $source)) {
              Write-Error "GameBot folder was not found in RFDP repository."
              exit 1
          }

          if (Test-Path $destination) {
              Remove-Item `
                -Path $destination `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Copy-Item `
            -Path "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\GameBot\START_GAMEBOT.bat")) {
              Write-Error "START_GAMEBOT.bat was not found inside GameBot."
              exit 1
          }

          Write-Host "GameBot copied to C:\GameBot successfully."


      # ============================================================
      # 5. CONFIGURE GAMEBOT AUTO START
      # ============================================================

      - name: Configure GameBot Auto Start
        shell: pwsh
        run: |
          Write-Host "Configuring GameBot automatic startup..."

          $startupPath = "C:\Users\TMA\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item `
            -ItemType Directory `
            -Path $startupPath `
            -Force | Out-Null

          $startupBat = Join-Path `
            $startupPath `
            "START_GAMEBOT_AUTOMATICALLY.bat"

          $content = @'
          @echo off
          cd /d C:\GameBot
          call START_GAMEBOT.bat
          '@

          Set-Content `
            -Path $startupBat `
            -Value $content `
            -Encoding ASCII

          if (-not (Test-Path $startupBat)) {
              Write-Error "GameBot startup file could not be created."
              exit 1
          }

          Write-Host "GameBot Auto Start configured successfully."
          Write-Host "GameBot will start when TMA logs into Windows."


      # ============================================================
      # 6. INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Downloading Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."


      # ============================================================
      # 7. CONNECT TO TAILSCALE
      # ============================================================

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing or empty."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale authentication failed."
              exit 1
          }

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $candidate = & $tailscale ip -4 2>$null

              if ($candidate) {

                  $candidate = (
                    $candidate |
                    Select-Object -First 1
                  ).Trim()

                  if ($candidate -match '^100\.') {
                      $tsIP = $candidate
                  }
              }

              if (-not $tsIP) {
                  Write-Host "Waiting for Tailscale IP... ($($retries + 1)/10)"
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"


      # ============================================================
      # 8. VERIFY RDP
      # ============================================================

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing Remote Desktop..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {

              Restart-Service `
                -Name TermService `
                -Force

              Start-Sleep -Seconds 5

              $testResult = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue
          }

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "RDP connectivity successful!"


      # ============================================================
      # 9. KEEP RFDP RUNNING
      # ============================================================

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                  RFDP READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: TMA"
          Write-Host "Password: 14789632Javad@"
          Write-Host "Port    : 3389"
          Write-Host ""
          Write-Host "GameBot : C:\GameBot"
          Write-Host "AutoRun : ENABLED"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RFDP CONNECTION IS ACTIVE"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP ACTIVE"
              Start-Sleep -Seconds 300
          }
