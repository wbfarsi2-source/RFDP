name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow incoming RDP connections on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force


      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper |
              Get-Random -Count 4

          $rawPassword += $charSet.Lower |
              Get-Random -Count 4

          $rawPassword += $charSet.Number |
              Get-Random -Count 4

          $rawPassword += $charSet.Special |
              Get-Random -Count 4

          $password = -join (
              $rawPassword |
              Sort-Object { Get-Random }
          )

          $securePass = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -AccountNeverExpires

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP"

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"

          "RDP_CREDS=User: RDP | Password: $password" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "RDP_PASSWORD=$password" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }


      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
              -Uri $tsUrl `
              -OutFile $installerPath

          Start-Process `
              msiexec.exe `
              -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
              -Wait

          Remove-Item `
              $installerPath `
              -Force


      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Connect Tailscale using the original authentication method
          & $tailscale up `
              --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
              --hostname="gh-runner-$env:GITHUB_RUN_ID"

          # Wait for Tailscale IPv4 address
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & $tailscale ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          $tsIP = ($tsIP | Select-Object -First 1).Trim()

          "TAILSCALE_IP=$tsIP" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Tailscale IP assigned: $tsIP"


      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"


      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active - Cancel workflow to terminate"

              Start-Sleep -Seconds 300
          }
