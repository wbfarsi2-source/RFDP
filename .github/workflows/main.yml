name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rfdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURE WINDOWS REMOTE DESKTOP
      # ============================================================

      - name: Configure RFDP Remote Desktop
        shell: pwsh
        run: |
          Write-Host "Configuring RFDP Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep NLA enabled
          # RDP-Tcp is the official Windows registry name
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Enable Remote Desktop service
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          $service = Get-Service -Name TermService

          if ($service.Status -eq 'Running') {
              Restart-Service -Name TermService -Force
          }
          else {
              Start-Service -Name TermService
          }

          Start-Sleep -Seconds 2

          $service = Get-Service -Name TermService

          if ($service.Status -ne 'Running') {
              Write-Error "Remote Desktop service could not be started."
              exit 1
          }

          Write-Host "RFDP Remote Desktop configured successfully."


      # ============================================================
      # 2. CREATE RFDP WINDOWS USER
      # ============================================================

      - name: Create RFDP User
        shell: pwsh
        run: |
          Write-Host "Creating RFDP user..."

          # Password character sets
          $upper   = [char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
          $lower   = [char[]]'abcdefghijklmnopqrstuvwxyz'
          $numbers = [char[]]'0123456789'
          $special = [char[]]'!@#$%*-_+='

          $rawPassword = @()

          $rawPassword += $upper |
              Get-Random -Count 4

          $rawPassword += $lower |
              Get-Random -Count 4

          $rawPassword += $numbers |
              Get-Random -Count 4

          $rawPassword += $special |
              Get-Random -Count 4

          # Shuffle password
          $password = -join (
              $rawPassword |
              Sort-Object { Get-Random }
          )

          $securePass = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          # Remove old RFDP user if it exists
          $existingUser = Get-LocalUser `
              -Name "RFDP" `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "Existing RFDP user found. Removing..."

              Remove-LocalUser `
                  -Name "RFDP"
          }

          # Create RFDP Windows user
          New-LocalUser `
              -Name "RFDP" `
              -Password $securePass `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -Description "RFDP Remote Desktop User"

          # Administrator access
          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RFDP"

          # Official Windows Remote Desktop group
          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RFDP"

          # Verify user
          $verifyUser = Get-LocalUser `
              -Name "RFDP" `
              -ErrorAction SilentlyContinue

          if (-not $verifyUser) {
              Write-Error "RFDP user creation failed."
              exit 1
          }

          # Save password for following workflow steps
          "RFDP_PASSWORD=$password" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "RFDP user created successfully."


      # ============================================================
      # 3. CONNECT RFDP TO TAILSCALE
      # ============================================================

      - name: Connect RFDP to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest


      # ============================================================
      # 4. CONFIGURE RFDP FIREWALL
      # ============================================================

      - name: Configure RFDP Firewall
        shell: pwsh
        run: |
          Write-Host "Configuring RFDP firewall..."

          # Delete our previous firewall rule if present
          Remove-NetFirewallRule `
              -DisplayName "RFDP-Tailscale" `
              -ErrorAction SilentlyContinue

          # Allow Remote Desktop only from Tailscale IPv4 network
          New-NetFirewallRule `
              -DisplayName "RFDP-Tailscale" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389 `
              -RemoteAddress "100.64.0.0/10" `
              -Profile Any

          $rule = Get-NetFirewallRule `
              -DisplayName "RFDP-Tailscale" `
              -ErrorAction SilentlyContinue

          if (-not $rule) {
              Write-Error "RFDP firewall rule creation failed."
              exit 1
          }

          Write-Host "RFDP firewall configured successfully."


      # ============================================================
      # 5. GET RFDP TAILSCALE IP
      # ============================================================

      - name: Get RFDP Tailscale IP
        shell: pwsh
        run: |
          Write-Host "Searching for RFDP Tailscale IP..."

          $tailscaleCommand = Get-Command `
              tailscale.exe `
              -ErrorAction SilentlyContinue

          if (-not $tailscaleCommand) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          $tailscale = $tailscaleCommand.Source

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              try {

                  $candidate = (
                      & $tailscale ip -4 2>$null |
                      Select-Object -First 1
                  )

                  if ($candidate) {

                      $candidate = $candidate.Trim()

                      if ($candidate -match '^100\.') {

                          $tsIP = $candidate

                          break
                      }
                  }
              }
              catch {

                  Write-Host "Tailscale IP not ready yet..."
              }

              Write-Host "Waiting for RFDP Tailscale IP... ($i/20)"

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {

              Write-Error "RFDP Tailscale IPv4 address was not assigned."

              exit 1
          }

          # Save IP for later workflow steps
          "RFDP_TAILSCALE_IP=$tsIP" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "RFDP Tailscale IP detected:"
          Write-Host "$tsIP"
          Write-Host ""


      # ============================================================
      # 6. CHECK REMOTE DESKTOP SERVICE
      # ============================================================

      - name: Check RFDP Service
        shell: pwsh
        run: |
          Write-Host "Checking Remote Desktop service..."

          $service = Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

          if (-not $service) {

              Write-Error "Remote Desktop service was not found."

              exit 1
          }

          if ($service.Status -ne "Running") {

              Write-Host "Starting Remote Desktop service..."

              Start-Service `
                  -Name TermService

              Start-Sleep -Seconds 3
          }

          $service = Get-Service -Name TermService

          if ($service.Status -ne "Running") {

              Write-Error "Remote Desktop service is not running."

              exit 1
          }

          Write-Host "Remote Desktop service is running successfully."


      # ============================================================
      # 7. VERIFY RFDP PORT 3389
      # ============================================================

      - name: Verify RFDP Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Testing RFDP connection..."
          Write-Host "Address: $env:RFDP_TAILSCALE_IP"
          Write-Host "Port   : 3389"
          Write-Host ""

          $result = Test-NetConnection `
              -ComputerName $env:RFDP_TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {

              Write-Host "First RFDP test failed."
              Write-Host "Restarting Remote Desktop service..."

              Restart-Service `
                  -Name TermService `
                  -Force

              Start-Sleep -Seconds 5

              $result = Test-NetConnection `
                  -ComputerName $env:RFDP_TAILSCALE_IP `
                  -Port 3389 `
                  -WarningAction SilentlyContinue
          }

          if (-not $result.TcpTestSucceeded) {

              Write-Error "RFDP connection on port 3389 is not accessible."

              exit 1
          }

          Write-Host ""
          Write-Host "RFDP connection verified successfully!"
          Write-Host ""


      # ============================================================
      # 8. SHOW RFDP CONNECTION INFORMATION
      # ============================================================

      - name: Show RFDP Connection Info
        shell: pwsh
        run: |
          # IMPORTANT:
          # Do not use Clear-Host here.
          # GitHub Actions does not provide a normal interactive console
          # and Clear-Host can cause CursorPosition / invalid handle errors.

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                 RFDP READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:RFDP_TAILSCALE_IP"
          Write-Host "Username: RFDP"
          Write-Host "Password: $env:RFDP_PASSWORD"
          Write-Host "Port    : 3389"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RFDP CONNECTION IS ACTIVE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Use Windows Remote Desktop Connection."
          Write-Host ""
          Write-Host "Keep this workflow running while connected."
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP ACTIVE"

              Start-Sleep -Seconds 300
          }
