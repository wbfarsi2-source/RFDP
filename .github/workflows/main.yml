name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rfdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURE WINDOWS REMOTE DESKTOP
      # ============================================================

      - name: Configure RFDP Remote Desktop
        shell: pwsh
        run: |
          Write-Host "Configuring RFDP Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # RDP-Tcp is the official Windows registry path
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Enable Remote Desktop service
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          $service = Get-Service -Name TermService

          if ($service.Status -eq 'Running') {
              Restart-Service -Name TermService -Force
          }
          else {
              Start-Service -Name TermService
          }

          Write-Host "RFDP Remote Desktop configured successfully."


      # ============================================================
      # 2. CREATE RFDP WINDOWS USER
      # ============================================================

      - name: Create RFDP User
        shell: pwsh
        run: |
          Write-Host "Creating RFDP user..."

          # Character sets used for random password
          $upper   = [char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
          $lower   = [char[]]'abcdefghijklmnopqrstuvwxyz'
          $numbers = [char[]]'0123456789'
          $special = [char[]]'!@#$%*-_+='

          $rawPassword = @()

          $rawPassword += $upper |
            Get-Random -Count 4

          $rawPassword += $lower |
            Get-Random -Count 4

          $rawPassword += $numbers |
            Get-Random -Count 4

          $rawPassword += $special |
            Get-Random -Count 4

          # Shuffle password characters
          $password = -join (
            $rawPassword |
            Sort-Object { Get-Random }
          )

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove previous RFDP account if it exists
          $existingUser = Get-LocalUser `
            -Name "RFDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Existing RFDP user found. Removing it..."

              Remove-LocalUser `
                -Name "RFDP"
          }

          # Create RFDP account
          New-LocalUser `
            -Name "RFDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RFDP Remote Desktop User"

          # Add RFDP to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RFDP"

          # Official Windows Remote Desktop group
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RFDP"

          # Save password for later steps
          "RFDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Verify account creation
          $verifyUser = Get-LocalUser `
            -Name "RFDP" `
            -ErrorAction SilentlyContinue

          if (-not $verifyUser) {
              Write-Error "RFDP user creation failed."
              exit 1
          }

          Write-Host "RFDP user created successfully."


      # ============================================================
      # 3. CONNECT TO TAILSCALE
      # ============================================================

      - name: Connect RFDP to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest


      # ============================================================
      # 4. CONFIGURE FIREWALL
      # ============================================================

      - name: Configure RFDP Firewall
        shell: pwsh
        run: |
          Write-Host "Configuring RFDP firewall..."

          # Remove previous RFDP rule if present
          Remove-NetFirewallRule `
            -DisplayName "RFDP-Tailscale" `
            -ErrorAction SilentlyContinue

          # Allow port 3389 only from Tailscale IPv4 network
          New-NetFirewallRule `
            -DisplayName "RFDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Write-Host "RFDP firewall configured successfully."


      # ============================================================
      # 5. FIND TAILSCALE IP
      # ============================================================

      - name: Get RFDP Tailscale IP
        shell: pwsh
        run: |
          Write-Host "Searching for RFDP Tailscale IP..."

          $tailscaleCommand = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if (-not $tailscaleCommand) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          $tailscale = $tailscaleCommand.Source

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              try {

                  $candidate = (
                    & $tailscale ip -4 2>$null |
                    Select-Object -First 1
                  )

                  if ($candidate) {
                      $candidate = $candidate.Trim()
                  }

                  if ($candidate -match '^100\.') {
                      $tsIP = $candidate
                      break
                  }

              }
              catch {
                  Write-Host "Tailscale IP not ready yet..."
              }

              Write-Host "Waiting for RFDP Tailscale IP... ($i/20)"

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Error "RFDP Tailscale IPv4 address was not assigned."
              exit 1
          }

          # Save IP for next workflow steps
          "RFDP_TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "RFDP Tailscale IP detected:"
          Write-Host "$tsIP"
          Write-Host ""


      # ============================================================
      # 6. CHECK REMOTE DESKTOP SERVICE
      # ============================================================

      - name: Check RFDP Service
        shell: pwsh
        run: |
          Write-Host "Checking Remote Desktop service..."

          $service = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if (-not $service) {
              Write-Error "Remote Desktop service was not found."
              exit 1
          }

          if ($service.Status -ne "Running") {
              Write-Host "Starting Remote Desktop service..."

              Start-Service `
                -Name TermService

              Start-Sleep -Seconds 3
          }

          Write-Host "Remote Desktop service status:"
          Get-Service -Name TermService


      # ============================================================
      # 7. VERIFY PORT 3389
      # ============================================================

      - name: Verify RFDP Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Testing RFDP..."
          Write-Host "IP: $env:RFDP_TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host ""

          $result = Test-NetConnection `
            -ComputerName $env:RFDP_TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {

              Write-Host "First RFDP test failed."
              Write-Host "Restarting Remote Desktop service..."

              Restart-Service `
                -Name TermService `
                -Force

              Start-Sleep -Seconds 5

              $result = Test-NetConnection `
                -ComputerName $env:RFDP_TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue
          }

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RFDP connection on port 3389 is not accessible."
              exit 1
          }

          Write-Host ""
          Write-Host "RFDP connection verified successfully!"
          Write-Host ""


      # ============================================================
      # 8. SHOW CONNECTION INFORMATION
      # ============================================================

      - name: Show RFDP Connection Info
        shell: pwsh
        run: |
          Clear-Host

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                 RFDP READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:RFDP_TAILSCALE_IP"
          Write-Host "Username: RFDP"
          Write-Host "Password: $env:RFDP_PASSWORD"
          Write-Host ""
          Write-Host "Port    : 3389"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " Connect using Windows Remote Desktop"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP ACTIVE"

              Start-Sleep -Seconds 300
          }
