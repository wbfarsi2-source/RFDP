name: RFDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Disable Network Level Authentication
          # Same configuration as original working version
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Remove previous firewall rule if it exists
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP connections on port 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop configured successfully."


      - name: Create Javad User
        shell: pwsh
        run: |
          Write-Host "Creating Javad Windows user..."

          $username = "Javad"
          $password = "14789632Javad@"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove existing Javad user if present
          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name $username
          }

          # Create Windows user
          New-LocalUser `
            -Name $username `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RFDP Remote Desktop User"

          # Add user to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          # Add user to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Verify creation
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              Write-Error "Javad user creation failed."
              exit 1
          }

          Write-Host "Javad user created successfully."


      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Downloading Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."


      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Prevent getting stuck on manual browser authentication
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing or empty."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale authentication failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $candidate = & $tailscale ip -4 2>$null

              if ($candidate) {
                  $tsIP = (
                      $candidate |
                      Select-Object -First 1
                  ).Trim()
              }

              if (-not $tsIP) {
                  Write-Host "Waiting for IP... ($($retries + 1)/10)"
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"
          Write-Host ""


      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP connection..."
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host ""
          Write-Host "RDP connectivity successful!"
          Write-Host ""


      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                  RFDP READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: Javad"
          Write-Host "Password: 14789632Javad@"
          Write-Host "Port    : 3389"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RFDP CONNECTION IS ACTIVE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Keep this workflow running while connected."
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RFDP ACTIVE"
              Start-Sleep -Seconds 300
          }
