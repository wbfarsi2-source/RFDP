<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { PublicKey, TransactionMessage, VersionedTransaction } from './solana-web3.js';
import {
  TOKEN_2022_PROGRAM_ID,
  createAssociatedTokenAccountIdempotentInstruction,
  createBurnCheckedInstruction,
  createTransferCheckedInstruction,
  getAssociatedTokenAddressSync,
} from './solana-spl-token.js';

function b64(bytes){
  let out=''; const step=0x8000;
  for(let i=0;i<bytes.length;i+=step) out += String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));
  return btoa(out);
}
window.buildMarketplaceTx = function(quoteJson,payer58,blockhash){
  try{
    const q=typeof quoteJson==='string'?JSON.parse(quoteJson):quoteJson;
    const payer=new PublicKey(String(payer58));
    const mint=new PublicKey(String(q.mint));
    const treasury=new PublicKey(String(q.treasury));
    const seller=new PublicKey(String(q.sellerPubkey));
    const decimals=Number(q.decimals)|0;
    const treasuryAmt=BigInt(String(q.treasuryAmount));
    let burnAmt=0n;
    if(q.burnAmount!=null && String(q.burnAmount)!=='') burnAmt=BigInt(String(q.burnAmount));
    const sellerAmt=BigInt(String(q.sellerAmount));
    const totalAmt=BigInt(String(q.totalAmount));
    if(!(burnAmt===0n && treasuryAmt+sellerAmt===totalAmt) && treasuryAmt+burnAmt+sellerAmt!==totalAmt) throw new Error('bad_quote_split');
    const userAta=getAssociatedTokenAddressSync(mint,payer,false,TOKEN_2022_PROGRAM_ID);
    const treasuryAta=getAssociatedTokenAddressSync(mint,treasury,false,TOKEN_2022_PROGRAM_ID);
    const sellerAta=getAssociatedTokenAddressSync(mint,seller,false,TOKEN_2022_PROGRAM_ID);
    const ix=[];
    // Idempotent ATA creation is safe when the account already exists, and makes a
    // single-listing purchase robust when either destination has never held $KINS.
    ix.push(createAssociatedTokenAccountIdempotentInstruction(payer,treasuryAta,treasury,mint,TOKEN_2022_PROGRAM_ID));
    ix.push(createAssociatedTokenAccountIdempotentInstruction(payer,sellerAta,seller,mint,TOKEN_2022_PROGRAM_ID));
    // Match Kintara's public wallet module ordering: seller, treasury, then burn.
    ix.push(createTransferCheckedInstruction(userAta,mint,sellerAta,payer,sellerAmt,decimals,[],TOKEN_2022_PROGRAM_ID));
    if(treasuryAmt>0n) ix.push(createTransferCheckedInstruction(userAta,mint,treasuryAta,payer,treasuryAmt,decimals,[],TOKEN_2022_PROGRAM_ID));
    if(burnAmt>0n) ix.push(createBurnCheckedInstruction(userAta,mint,payer,burnAmt,decimals,[],TOKEN_2022_PROGRAM_ID));
    const msg=new TransactionMessage({payerKey:payer,recentBlockhash:String(blockhash),instructions:ix}).compileToV0Message();
    const tx=new VersionedTransaction(msg);
    AndroidBridge.onResult(JSON.stringify({ok:true,transactionBase64:b64(tx.serialize()),userAta:userAta.toBase58(),totalAmount:String(totalAmt)}));
  }catch(e){AndroidBridge.onResult(JSON.stringify({ok:false,error:String(e&&e.message||e)}));}
};
AndroidBridge.onReady();
</script></body></html>
